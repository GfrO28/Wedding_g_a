<svg xmlns="http://www.w3.org/2000/svg" width="1125" height="4000" viewBox="0 0 1125 4000">
  <!-- Plantilla: solapa lateral (izquierda), 9:32. Borrá las guías y dejá el fondo transparente al exportar. -->
  <rect width="1125" height="4000" fill="none" stroke="#bbb" stroke-width="4" stroke-dasharray="24 16"/>
  <polygon points="0,0 1125,2000 0,4000" fill="#6b2333" fill-opacity="0.18" stroke="#6b2333" stroke-width="6"/>
  <line x1="3" y1="0" x2="3" y2="4000" stroke="#2563eb" stroke-width="6"/>
  <circle cx="1121" cy="2000" r="14" fill="#2563eb"/>
  <g font-family="Arial, sans-serif" fill="#2563eb" font-size="40">
    <text x="30" y="120">Bisagra: borde recto, opaco de arriba abajo</text>
    <text x="560" y="1940" text-anchor="middle">Punta: centro del borde derecho</text>
    <text x="30" y="3900" fill="#666">Solapa lateral · 1125 × 4000 px (9:32)</text>
    <text x="30" y="3950" fill="#666">PNG/WebP transparente · la sombra puede salir hacia la punta</text>
  </g>
</svg>
